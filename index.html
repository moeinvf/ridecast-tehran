<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RideCast" />
  <title>RideCast تهران</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <style>
    :root{
      --bg:#0a0f1c;--panel:#121a2b;--panel2:#0e1525;--line:#26314a;
      --txt:#f8fafc;--muted:#98a3b5;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;background:
      radial-gradient(circle at 80% -10%,rgba(68,91,135,.26),transparent 34%),
      linear-gradient(180deg,#0b1020 0%,#090e19 100%);
      color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
    button,input{font:inherit}
    button{touch-action:manipulation}
    .wrap{max-width:760px;margin:auto;padding:18px 14px 72px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:4px 0 14px}
    .brandrow{display:flex;align-items:center;gap:10px}
    .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#111a2d;border:1px solid #293653;font-size:21px}
    .brand{font-size:19px;font-weight:900;letter-spacing:-.2px}
    .city{font-size:12px;color:var(--muted);margin-top:2px}
    .date{font-size:13px;color:#d4d9e2;margin-top:8px}
    .iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#101729;color:#fff;display:grid;place-items:center;font-size:18px;cursor:pointer}
    .card{background:rgba(18,26,43,.92);border:1px solid #202a40;border-radius:24px;padding:18px;margin-bottom:14px;backdrop-filter:blur(10px)}
    .hero{padding:20px}
    .statusline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .status{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:850}
    .good{background:#12371f;color:#86f0aa}.warn{background:#3d2b0c;color:#ffd36d}.bad{background:#3f171b;color:#ff9ba2}
    .updated{font-size:11px;color:var(--muted)}
    .verdict{font-size:31px;line-height:1.25;font-weight:950;margin:14px 0 10px;letter-spacing:-.6px}
    .reasons{display:grid;gap:7px;margin:0 0 15px;padding:0;list-style:none}
    .reason{display:flex;gap:8px;align-items:flex-start;color:#e8ecf3;font-size:14px;line-height:1.65}
    .dot{width:6px;height:6px;border-radius:50%;background:#8190a9;margin-top:8px;flex:0 0 auto}
    .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .pill{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:11px 10px}
    .pill .k{font-size:11px;color:var(--muted);margin-bottom:3px}
    .pill .v{font-size:15px;font-weight:800}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
    .section-title{font-size:17px;font-weight:900}
    .section-note{font-size:11px;color:var(--muted)}
    .hours{display:flex;gap:9px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;direction:rtl}
    .hours::-webkit-scrollbar{display:none}
    .hour{min-width:112px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:11px}
    .hour .day{font-size:10px;color:#bcc5d3}.hour .time{font-size:12px;color:var(--muted);margin-top:2px}
    .hour .temp{font-size:21px;font-weight:900;margin:8px 0 6px}
    .hour .mini{font-size:11px;color:#b6c0cf;line-height:1.55}
    .tag{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;margin-top:8px}
    .routes{display:grid;gap:10px}
    .empty{border:1px dashed #34415d;border-radius:16px;padding:14px;color:var(--muted);font-size:13px;line-height:1.8;text-align:center}
    .route{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:13px}
    .route-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .route-name{font-size:14px;font-weight:900;min-width:0;overflow-wrap:anywhere}
    .delete{border:0;background:transparent;color:#8390a5;font-size:22px;line-height:1;cursor:pointer;padding:2px 4px}
    .triprows{display:grid;gap:7px;margin-top:11px}
    .triprow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:7px;border-top:1px solid #202a40}
    .triptime{font-size:12px;color:#c5cddd}.tripresult{font-size:11px;font-weight:850}
    .addbtn{width:100%;border:1px dashed #3a4969;border-radius:16px;padding:13px;background:#101729;color:#eef2f7;font-weight:850;cursor:pointer;margin-top:10px}
    dialog{border:1px solid #2a3650;border-radius:22px;background:#121a2b;color:#fff;width:min(92vw,520px);padding:18px}
    dialog::backdrop{background:#020617cc}
    .field{display:grid;gap:6px}.field label{font-size:12px;color:#c7ced9}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    input{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line);background:#0e1525;color:#fff;padding:11px 12px;font-size:16px}
    .actions{display:flex;gap:10px;margin-top:14px}
    .btn{flex:1;border:0;border-radius:14px;padding:12px 14px;font-weight:900;cursor:pointer}
    .btn.primary{background:#fff;color:#111827}.btn.secondary{background:#0e1525;color:#fff;border:1px solid var(--line)}
    .foot{text-align:center;color:#748097;font-size:11px;line-height:1.8;margin-top:18px}
    @media(max-width:430px){
      .verdict{font-size:27px}.meta{grid-template-columns:1fr 1fr 1fr}.grid{grid-template-columns:1fr}.card{border-radius:21px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brandrow">
        <div class="logo">🏍️</div>
        <div><div class="brand">RideCast</div><div class="city">تهران · مخصوص موتور</div></div>
      </div>
      <div id="todayDate" class="date">—</div>
    </div>
    <div style="display:flex;gap:8px">
      <button id="notifyBtn" class="iconbtn" aria-label="فعال‌کردن اعلان">🔔</button>
      <button id="refreshBtn" class="iconbtn" aria-label="به‌روزرسانی">↻</button>
    </div>
  </header>

  <section class="card hero">
    <div class="statusline">
      <div id="badge" class="status warn">در حال بررسی...</div>
      <div id="updatedAt" class="updated">—</div>
    </div>
    <div id="verdict" class="verdict">وضعیت امروز در حال بررسی است</div>
    <ul id="reasons" class="reasons">
      <li class="reason"><span class="dot"></span><span>در حال دریافت پیش‌بینی تهران</span></li>
    </ul>
    <div class="meta">
      <div class="pill"><div class="k">دما</div><div id="tempNow" class="v">—</div></div>
      <div class="pill"><div class="k">بارش</div><div id="rainNow" class="v">—</div></div>
      <div class="pill"><div class="k">باد</div><div id="windNow" class="v">—</div></div>
    </div>
  </section>

  <section class="card">
    <div class="section-head">
      <div class="section-title">۲۴ ساعت آینده</div>
      <div class="section-note">هر ساعت یک وضعیت</div>
    </div>
    <div id="hours" class="hours"></div>
  </section>

  <section class="card">
    <div class="section-head">
      <div class="section-title">مسیرهای من</div>
      <div id="routeCount" class="section-note"></div>
    </div>
    <div id="routes" class="routes"></div>
    <button id="addRouteBtn" class="addbtn">+ افزودن مسیر داخل تهران</button>
  </section>

  <div class="foot">داده‌های هوا از Open‑Meteo · محدوده پیش‌بینی: تهران</div>
</div>

<dialog id="routeDialog">
  <form id="routeForm">
    <div class="section-title" style="margin-bottom:14px">مسیر جدید</div>
    <div class="grid">
      <div class="field"><label>مبدأ</label><input id="routeFrom" placeholder="مثلاً صادقیه" required maxlength="80"></div>
      <div class="field"><label>مقصد</label><input id="routeTo" placeholder="مثلاً ونک" required maxlength="80"></div>
    </div>
    <div class="grid" style="margin-top:10px">
      <div class="field"><label>ساعت رفت</label><input id="goTime" type="time" required></div>
      <div class="field"><label>ساعت برگشت (اختیاری)</label><input id="backTime" type="time"></div>
    </div>
    <div class="actions">
      <button type="button" id="cancelRoute" class="btn secondary">انصراف</button>
      <button class="btn primary">ذخیره</button>
    </div>
  </form>
</dialog>

<script>
const LAT=35.6892,LON=51.3890,TZ="Asia/Tehran";
const $=s=>document.querySelector(s);
const faNum=n=>new Intl.NumberFormat('fa-IR',{maximumFractionDigits:0}).format(Number.isFinite(Number(n))?Number(n):0);
const fmtTime=s=>new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ}).format(new Date(s));
const fmtDay=s=>new Intl.DateTimeFormat('fa-IR',{weekday:'short',timeZone:TZ}).format(new Date(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function nowParts(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t)?.value;
  return {date:`${g('year')}-${g('month')}-${g('day')}`,hour:g('hour'),minute:g('minute')};
}
function addDay(d){
  const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+1);return x.toISOString().slice(0,10);
}
function updateDate(){
  $("#todayDate").textContent=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:TZ}).format(new Date());
}
const emoji=code=>{
  if(code===0)return'☀️';if([1,2].includes(code))return'🌤️';if([3,45,48].includes(code))return'☁️';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return'🌧️';
  if([71,73,75,77,85,86].includes(code))return'🌨️';if([95,96,99].includes(code))return'⛈️';return'🌤️'
};
function riskOf(prob,precip,wind,gust){
  let s=0;
  if(prob>=70)s+=3;else if(prob>=40)s+=2;else if(prob>=20)s+=1;
  if(precip>=2)s+=3;else if(precip>=.6)s+=2;else if(precip>0)s+=1;
  if(gust>=55)s+=3;else if(gust>=40)s+=2;else if(gust>=30)s+=1;
  if(wind>=35)s+=2;else if(wind>=25)s+=1;
  return s>=5?'bad':s>=2?'warn':'good';
}
const rank=r=>({good:0,warn:1,bad:2}[r]??0);
const detail=r=>r==='good'?'مناسب':r==='warn'?'احتیاط':'ریسک بالا';

function next24(h){
  const n=nowParts(),key=`${n.date}T${n.hour}:00`;
  const all=h.time.map((t,i)=>({t,i}));let start=all.findIndex(x=>x.t>=key);if(start<0)start=0;
  return all.slice(start,start+24);
}
function buildReasons(rows){
  const firstRisk=rows.find(x=>x.risk!=='good');
  const maxProb=Math.max(...rows.map(x=>x.prob));
  const maxGust=Math.max(...rows.map(x=>x.gust));
  const maxWind=Math.max(...rows.map(x=>x.wind));
  const out=[];
  if(firstRisk){
    if(firstRisk.prob>=40||firstRisk.precip>=.6) out.push(`بارش از حوالی ${fmtTime(firstRisk.time)} جدی‌تر می‌شود`);
    else if(firstRisk.gust>=30||firstRisk.wind>=25) out.push(`باد از حوالی ${fmtTime(firstRisk.time)} آزاردهنده‌تر می‌شود`);
  } else {
    out.push(maxProb<20?'بارش قابل‌توجهی پیش‌بینی نشده':'بیشتر ساعات بدون بارش جدی می‌گذرد');
  }
  if(maxGust>=40) out.push(`تندباد تا حدود ${faNum(maxGust)} km/h می‌رسد`);
  else if(maxWind>=25) out.push(`بیشترین باد حدود ${faNum(maxWind)} km/h است`);
  else out.push('باد در محدوده مناسب موتورسواری می‌ماند');
  return out.slice(0,2);
}
function overallVerdict(rows){
  const bad=rows.filter(x=>x.risk==='bad').length,warn=rows.filter(x=>x.risk==='warn').length;
  return bad>=2?'bad':(bad||warn>=4)?'warn':'good';
}
function heroText(r){
  return r==='good'?'امروز شرایط برای موتور خوبه':r==='warn'?'امروز با احتیاط برو':'امروز بهتره موتور نبری';
}

async function loadWeather(silent=false){
  if(!silent){$("#badge").className='status warn';$("#badge").textContent='در حال بررسی...'}
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m&current=temperature_2m,precipitation,rain,showers,weather_code,wind_speed_10m,wind_gusts_10m&timezone=${encodeURIComponent(TZ)}&forecast_days=3`;
    const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('weather');
    const data=await res.json(),h=data.hourly;
    const rows=next24(h).map(({i})=>({
      time:h.time[i],temp:h.temperature_2m[i],prob:h.precipitation_probability[i]??0,
      precip:h.precipitation[i]??0,code:h.weather_code[i],wind:h.wind_speed_10m[i]??0,gust:h.wind_gusts_10m[i]??0
    }));
    rows.forEach(x=>x.risk=riskOf(x.prob,x.precip,x.wind,x.gust));
    const overall=overallVerdict(rows);
    $("#badge").className='status '+overall;
    $("#badge").textContent=overall==='good'?'🟢 مناسب موتور':overall==='warn'?'🟡 با احتیاط':'🔴 نامناسب موتور';
    $("#verdict").textContent=heroText(overall);
    $("#reasons").innerHTML=buildReasons(rows).map(t=>`<li class="reason"><span class="dot"></span><span>${t}</span></li>`).join('');

    const c=data.current||{},currentPrecip=(c.precipitation??0)+(c.rain??0)+(c.showers??0);
    $("#tempNow").textContent=`${faNum(c.temperature_2m)}°`;
    $("#rainNow").textContent=currentPrecip>0?`${faNum(currentPrecip)} mm`:`${faNum(rows[0]?.prob??0)}٪`;
    $("#windNow").textContent=`${faNum(c.wind_speed_10m??0)} km/h`;
    $("#updatedAt").textContent=`به‌روز شده ${new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit',timeZone:TZ}).format(new Date())}`;

    $("#hours").innerHTML=rows.map(x=>{
      const extra=x.prob>=20?`بارش ${faNum(x.prob)}٪`:x.wind>=25?`باد ${faNum(x.wind)}`:'شرایط پایدار';
      return `<div class="hour">
        <div class="day">${fmtDay(x.time)}</div><div class="time">${fmtTime(x.time)}</div>
        <div class="temp">${emoji(x.code)} ${faNum(x.temp)}°</div>
        <div class="mini">${extra}</div>
        <span class="tag ${x.risk}">${detail(x.risk)}</span>
      </div>`
    }).join('');

    window.__weatherRows=rows;
    renderRoutes();

    const currentRisk=riskOf(0,currentPrecip,c.wind_speed_10m??0,c.wind_gusts_10m??0);
    const old=localStorage.getItem('ridecast-current-risk');
    localStorage.setItem('ridecast-current-risk',currentRisk);
    if(old&&rank(currentRisk)>rank(old)&&'Notification'in window&&Notification.permission==='granted'){
      try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('🏍️ وضعیت تهران بدتر شد',{body:currentRisk==='bad'?'شرایط برای موتورسواری پرریسک شده.':'شرایط نیاز به احتیاط بیشتری دارد.'})}catch(e){}
    }
  }catch(e){
    if(!silent){
      $("#badge").className='status bad';$("#badge").textContent='خطا در دریافت هوا';
      $("#verdict").textContent='داده هوا در دسترس نیست';
      $("#reasons").innerHTML='<li class="reason"><span class="dot"></span><span>اینترنت را بررسی کن و دوباره به‌روزرسانی بزن</span></li>';
    }
  }
}

function getRoutes(){try{return JSON.parse(localStorage.getItem('ridecast-routes')||'[]')}catch{return[]}}
function saveRoutes(r){localStorage.setItem('ridecast-routes',JSON.stringify(r))}
function targetForTime(time){
  if(!time)return null;
  const n=nowParts(),nowClock=`${n.hour}:${n.minute}`,date=time>=nowClock?n.date:addDay(n.date);
  return `${date}T${time}`;
}
function routeRisk(time){
  if(!window.__weatherRows||!time)return null;
  const target=targetForTime(time);
  return window.__weatherRows.reduce((a,b)=>Math.abs(new Date(b.time)-new Date(target))<Math.abs(new Date(a.time)-new Date(target))?b:a,window.__weatherRows[0]);
}
function renderRoutes(){
  const routes=getRoutes(),box=$("#routes");
  $("#routeCount").textContent=routes.length?`${faNum(routes.length)} مسیر`:'';
  if(!routes.length){
    box.innerHTML='<div class="empty">هنوز مسیری اضافه نکردی.<br>مبدأ، مقصد و ساعت رفت‌وبرگشت را ثبت کن.</div>';return;
  }
  box.innerHTML=routes.map((r,idx)=>{
    const go=routeRisk(r.go),back=routeRisk(r.back);
    return `<div class="route">
      <div class="route-top">
        <div class="route-name">${esc(r.from||'مبدأ')} ← ${esc(r.to||'مقصد')}</div>
        <button data-del="${idx}" class="delete" aria-label="حذف">×</button>
      </div>
      <div class="triprows">
        <div class="triprow"><span class="triptime">رفت · ${esc(r.go||'—')}</span><span class="tripresult ${go?.risk||'good'}">${detail(go?.risk||'good')}</span></div>
        ${r.back?`<div class="triprow"><span class="triptime">برگشت · ${esc(r.back)}</span><span class="tripresult ${back?.risk||'good'}">${detail(back?.risk||'good')}</span></div>`:''}
      </div>
    </div>`
  }).join('');
  box.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const r=getRoutes();r.splice(+b.dataset.del,1);saveRoutes(r);renderRoutes();
  }));
}

$("#refreshBtn").addEventListener('click',()=>loadWeather(false));
$("#notifyBtn").addEventListener('click',async()=>{
  if(!('Notification'in window)){return}
  const p=await Notification.requestPermission();
  if(p==='granted'){
    $("#notifyBtn").textContent='✓';
    $("#notifyBtn").setAttribute('aria-label','اعلان فعال است');
    try{const reg=await navigator.serviceWorker.ready;await reg.showNotification('🏍️ RideCast',{body:'اعلان‌ها فعال شد.'})}catch(e){}
  }
});
$("#addRouteBtn").addEventListener('click',()=>$("#routeDialog").showModal());
$("#cancelRoute").addEventListener('click',()=>$("#routeDialog").close());
$("#routeForm").addEventListener('submit',e=>{
  e.preventDefault();
  const routes=getRoutes();
  routes.push({from:$("#routeFrom").value.trim(),to:$("#routeTo").value.trim(),go:$("#goTime").value,back:$("#backTime").value});
  saveRoutes(routes);e.target.reset();$("#routeDialog").close();renderRoutes();
});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
if('Notification'in window&&Notification.permission==='granted'){$("#notifyBtn").textContent='✓'}
updateDate();loadWeather(false);setInterval(()=>loadWeather(true),10*60*1000);
</script>
</body>
</html>
